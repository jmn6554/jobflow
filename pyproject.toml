[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jobflow-local"
version = "0.2.0"
description = "Local-first job discovery, tracking, and human-approved application assistance"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=2.0,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.urls]
Repository = "https://github.com/jmn6554/jobflow"
Issues = "https://github.com/jmn6554/jobflow/issues"

[project.optional-dependencies]
browser = ["playwright>=1.52,<2", "websockets>=15,<16"]
dev = ["pytest>=8,<9"]

[project.scripts]
jobflow = "jobflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
